<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>資料包解析量測</title>
    <!-- Measures download and JSON.parse time of each data pack on the device that opens it (handoff todo 3-6).
         Standalone: shares no code with the app; build.cjs copies this file to dist as is. -->
    <style>
      :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --line: #d9d9d4; --accent: #9a5b13; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f1013; --fg: #e8e6e1; --muted: #9a978f; --line: #2c2d31; --accent: #e0a458; } }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, "Noto Sans TC", sans-serif; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p { margin: 4px 0; color: var(--muted); }
      button { margin: 12px 0; padding: 8px 16px; font: inherit; border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 6px; }
      button:disabled { opacity: .5; }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      table { font-size: 13px; }
      th, td { padding: 4px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
      th:first-child, td:first-child { text-align: left; }
      tfoot td { font-weight: 600; }
      .wrap { overflow-x: auto; }
      pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <h1>資料包解析量測</h1>
    <p>依序下載總目錄、搜尋索引與全部資料包，每個檔案下載 3 次（不使用快取）、解析 5 次，取中位數。</p>
    <p>「解析」只含 JSON.parse，不含網站整理資料與畫面繪製。</p>
    <button id="run">開始量測</button>
    <p id="status"></p>
    <div class="wrap"><table id="out" hidden>
      <thead><tr><th>檔案</th><th>大小 KB</th><th>下載 ms</th><th>解析 ms</th></tr></thead>
      <tbody></tbody><tfoot></tfoot>
    </table></div>
    <pre id="env"></pre>
    <script>
      const DOWNLOADS = 3, PARSES = 5;
      const $ = (id) => document.getElementById(id);
      const median = (xs) => { const s = [...xs].sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
      const fmt = (n) => n.toLocaleString('zh-TW', { maximumFractionDigits: 1, minimumFractionDigits: 1 });

      async function measure(path) {
        const downloads = [];
        let text = '';
        for (let i = 0; i < DOWNLOADS; i++) {
          const t0 = performance.now();
          const response = await fetch(path, { cache: 'no-store' });
          if (!response.ok) throw new Error(`${path} 回應 HTTP ${response.status}`);
          text = await response.text();
          downloads.push(performance.now() - t0);
        }
        const parses = [];
        for (let i = 0; i < PARSES; i++) {
          const t0 = performance.now();
          JSON.parse(text);
          parses.push(performance.now() - t0);
        }
        return { kb: new Blob([text]).size / 1024, download: median(downloads), parse: median(parses), text };
      }

      function addRow(name, r) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${name}</td><td>${fmt(r.kb)}</td><td>${fmt(r.download)}</td><td>${fmt(r.parse)}</td>`;
        $('out').tBodies[0].append(tr);
      }

      $('run').addEventListener('click', async () => {
        $('run').disabled = true;
        $('out').hidden = false;
        $('out').tBodies[0].innerHTML = '';
        $('out').tFoot.innerHTML = '';
        const started = new Date();
        try {
          const catalogResult = await measure('data/catalog.json');
          addRow('總目錄', catalogResult);
          const catalog = JSON.parse(catalogResult.text);
          const names = Object.fromEntries([
            ...catalog.civilizations.filter((c) => c.packs.length === 1).map((c) => [c.packs[0], c.name]),
            ...(catalog.periodOptions || []).map((p) => [p.id, p.name]),
          ]);
          const files = [['搜尋索引', catalog.searchIndex.file], ...Object.entries(catalog.packs).map(([id, info]) => [names[id] || id, info.file])];
          const all = [catalogResult];
          for (const [i, [name, file]] of files.entries()) {
            $('status').textContent = `量測中 ${i + 1}／${files.length}：${name}`;
            const r = await measure(file);
            all.push(r);
            addRow(name, r);
          }
          const sum = (key) => all.reduce((s, r) => s + r[key], 0);
          $('out').tFoot.innerHTML = `<tr><td>合計</td><td>${fmt(sum('kb'))}</td><td>${fmt(sum('download'))}</td><td>${fmt(sum('parse'))}</td></tr>`;
          $('status').textContent = `完成：${started.toLocaleString('zh-TW')}，buildId ${catalog.buildId}`;
        } catch (error) {
          $('status').textContent = `量測失敗：${error.message}`;
        }
        $('run').disabled = false;
      });

      $('env').textContent = [
        `瀏覽器：${navigator.userAgent}`,
        `CPU 核心數：${navigator.hardwareConcurrency || '未知'}`,
        `記憶體：${navigator.deviceMemory ? navigator.deviceMemory + ' GB（瀏覽器回報的近似值）' : '未知'}`,
        `網路：${navigator.connection?.effectiveType || '未知'}`,
        `螢幕：${screen.width}×${screen.height}，像素比 ${devicePixelRatio}`,
      ].join('\n');
    </script>
  </body>
</html>
