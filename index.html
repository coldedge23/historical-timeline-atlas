<!doctype html>
<html lang="zh-TW" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>歷史星圖 | 華夏與臺灣時空總覽（秦漢帝國與三國鼎立互動地圖）</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              ancient: {
                dark: '#0f1013',
                card: '#16171c',
                border: '#27282f',
                gold: '#c99a58',
              }
            },
            fontFamily: {
              serif: ['"Noto Serif TC"', 'Songti TC', 'Georgia', 'serif'],
              sans: ['"Noto Sans TC"', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Custom Antique Dark Styling -->
    <style>
      body {
        background-color: #0f1013;
        color: #e2dfd9;
        font-family: 'Noto Sans TC', sans-serif;
      }

      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #121316;
      }
      ::-webkit-scrollbar-thumb {
        background: #27282f;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #c99a58;
      }

      /* Leaflet map custom dark styling */
      .leaflet-container {
        background: #111215 !important;
        font-family: inherit;
      }

      /* Dark styling for OpenStreetMap tiles without API key */
      .dark-tiles .leaflet-tile {
        filter: brightness(0.65) invert(1) contrast(3.2) hue-rotate(205deg) saturate(0.35);
      }

      .pulse-ring {
        position: absolute;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }

      @keyframes pulse-ring {
        0% {
          transform: scale(0.6);
          opacity: 0.9;
        }
        80%, 100% {
          transform: scale(2.2);
          opacity: 0;
        }
      }

      .glass-panel {
        background: rgba(22, 23, 28, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      /* Leaflet popup dark theme override */
      .leaflet-popup-content-wrapper {
        background: #18191e !important;
        color: #e4e4e7 !important;
        border: 1px solid rgba(201, 154, 88, 0.3) !important;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8) !important;
        border-radius: 8px !important;
      }
      .leaflet-popup-tip {
        background: #18191e !important;
      }
    </style>
  </head>
  <body class="overflow-x-hidden selection:bg-amber-600/30 selection:text-amber-200">
    <div id="root"></div>

    <!-- Production Ready Bundled Application with Fresh Cache-Bypassing File -->
    <script src="./dist/bundle_v38.js"></script>
  </body>
</html>
